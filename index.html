<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quantum Chess</title>
<style>
  :root {
    --bg: #0b1634; --card: #13224a; --edge: #3fd0e6; --q: #3fb8ff; --text: #eef4ff; --muted: #9fb2d9;
    --ok: #3fe6a0; --bad: #ff6b81;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: linear-gradient(160deg, #241a6b 0%, #0b1634 45%, #0a3a73 100%) fixed;
               color: var(--text); font-family: "Avenir Next", "Segoe UI", Roboto, sans-serif; min-height: 100%; }
  main { max-width: 560px; margin: 0 auto; padding: 18px 16px 40px; }
  header { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  h1 { font-size: 26px; margin: 6px 0; line-height: 1.15; }
  h1 .q { color: var(--q); }
  .lang { display: flex; border: 1px solid var(--edge); border-radius: 999px; overflow: hidden; flex-shrink: 0; }
  .lang button { background: transparent; color: var(--text); border: 0; padding: 8px 14px; font-weight: 700; font-size: 15px; }
  .lang button.on { background: var(--edge); color: #06223a; }
  .sub { color: var(--muted); margin: 4px 0 18px; font-size: 16px; line-height: 1.4; }
  h2 { font-size: 15px; text-transform: uppercase; letter-spacing: 1.5px; color: var(--muted); margin: 22px 0 10px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .grid.three { grid-template-columns: 1fr 1fr 1fr; }
  .opt { background: var(--card); border: 2px solid transparent; border-radius: 14px; padding: 14px 12px; color: var(--text);
         text-align: left; font-size: 17px; font-weight: 700; min-height: 64px; cursor: pointer; }
  .opt small { display: block; font-weight: 500; color: var(--muted); font-size: 13px; margin-top: 3px; }
  .opt.on { border-color: var(--edge); box-shadow: 0 0 14px rgba(63, 208, 230, .35); }
  .grid.three .opt { text-align: center; white-space: nowrap; padding: 14px 6px; font-size: 16px; }
  .opt .dot { display: inline-block; width: 14px; height: 14px; border-radius: 50%; margin-right: 6px; vertical-align: -1px;
              border: 2px solid var(--edge); }
  .opt.w .dot { background: #f2f6ff; } .opt.b .dot { background: #111; } .opt.r .dot { background: linear-gradient(90deg, #f2f6ff 50%, #111 50%); }
  .pin { width: 100%; font-size: 34px; letter-spacing: 14px; text-align: center; padding: 12px; border-radius: 14px;
         border: 2px solid var(--edge); background: #0a1430; color: var(--q); font-weight: 800; }
  .start { width: 100%; margin-top: 22px; padding: 18px; border: 0; border-radius: 16px; font-size: 22px; font-weight: 800;
           background: linear-gradient(90deg, #3fd0e6, #3fb8ff); color: #06223a; cursor: pointer; }
  .start:disabled { opacity: .5; }
  #status { margin-top: 16px; padding: 14px; border-radius: 12px; background: rgba(63, 184, 255, .10);
            border-left: 4px solid var(--q); font-size: 16px; line-height: 1.4; min-height: 52px; }
  #status.ok { border-left-color: var(--ok); } #status.bad { border-left-color: var(--bad); }
  .staff { margin-top: 30px; border-top: 1px solid rgba(255, 255, 255, .15); padding-top: 16px; display: none; }
  .staff.on { display: block; }
  .staff button { background: transparent; border: 1px solid var(--bad); color: var(--bad); padding: 12px 16px;
                  border-radius: 12px; font-size: 16px; font-weight: 700; margin-right: 8px; }
  .hint { color: var(--muted); font-size: 13px; margin-top: 8px; }
  .hidden { display: none; }
  .toggle { display: flex; gap: 10px; }
  .toggle .opt { flex: 1; text-align: center; }
  #go { position: fixed; inset: 0; background: rgba(6, 14, 38, .94); display: none; flex-direction: column;
        align-items: center; justify-content: center; text-align: center; padding: 24px; z-index: 10; }
  #go.on { display: flex; animation: fadein .3s ease; }
  #go .tablet { width: 150px; height: 104px; border: 6px solid var(--edge); border-radius: 16px; position: relative;
                box-shadow: 0 0 30px rgba(63, 208, 230, .6); animation: bob 1.2s ease-in-out infinite; }
  #go .tablet::after { content: ""; position: absolute; inset: 14px; border-radius: 6px;
                       background: repeating-conic-gradient(#3a7fd6 0 25%, #20498a 0 50%) 0 0 / 30px 30px; }
  #go .arrow { font-size: 54px; color: var(--q); margin: 18px 0 6px; animation: bob 1.2s ease-in-out infinite reverse; }
  #go h3 { font-size: 30px; margin: 10px 0 8px; } #go p { color: var(--muted); font-size: 18px; margin: 0 0 24px; }
  #go .btns { display: flex; gap: 12px; }
  #go button { background: transparent; color: var(--text); border: 1px solid var(--edge); padding: 12px 20px;
               border-radius: 12px; font-size: 17px; font-weight: 700; }
  #go button.gold, .gold { background: #ffc83d; border-color: #ffc83d; color: #2a1d00; box-shadow: 0 0 16px rgba(255, 200, 61, .5); }
  #go .nophone { color: var(--text); font-size: 16px; margin: -10px 0 22px; opacity: .85; }
  .rules-link { background: transparent; border: 1px solid #ffc83d; color: #ffc83d; border-radius: 999px;
                padding: 6px 12px; font-size: 14px; font-weight: 700; margin-top: 4px; }
  #rules { position: fixed; inset: 0; background: rgba(6, 14, 38, .97); display: none; z-index: 20; overflow-y: auto; }
  #rules.on { display: block; animation: fadein .25s ease; }
  #rules .wrap { max-width: 560px; margin: 0 auto; padding: 20px 18px 40px; }
  #rules h3 { font-size: 26px; margin: 4px 0 14px; color: #ffc83d; }
  #rules .card { background: var(--card); border-radius: 14px; padding: 12px 14px; margin-bottom: 10px; }
  #rules .card b { display: block; font-size: 17px; margin-bottom: 3px; }
  #rules .card span { color: var(--muted); font-size: 15px; line-height: 1.4; }
  #rules .q, #rules .card b .q { color: var(--q); font-weight: 700; }
  #rules .card span b { font-size: inherit; color: var(--text); }
  #rules .close { position: sticky; top: 0; float: right; }
  @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
  @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
</style>
</head>
<body>
<main>
  <header>
    <h1 id="t-title"></h1>
    <div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px">
      <div class="lang"><button data-lang="es">ES</button><button data-lang="en">EN</button></div>
      <button class="rules-link" id="open-rules"></button></div>
  </header>
  <p class="sub" id="t-sub"></p>

  <h2 id="t-level"></h2>
  <div class="grid" id="levels"></div>

  <h2 id="t-color"></h2>
  <div class="grid three" id="colors"></div>
  <p class="hint" id="t-white-first"></p>

  <h2 id="t-hints"></h2>
  <div class="toggle" id="hints"></div>
  <p class="hint" id="t-hints-hint"></p>

  <div id="pin-box">
    <h2 id="t-pin"></h2>
    <input class="pin" id="pin" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off" placeholder="····">
  </div>

  <button class="start" id="start"></button>
  <div id="status"></div>

  <div class="staff" id="staff">
    <h2 id="t-staff"></h2>
    <button id="stop"></button>
    <p class="hint" id="t-staff-hint"></p>
  </div>
</main>
<div id="go"><div class="arrow">↓</div><div class="tablet"></div><h3 id="go-title"></h3><p id="go-text"></p>
  <p class="nophone" id="go-nophone"></p>
  <div class="btns"><button id="go-close"></button><button class="gold" id="go-rules"></button></div></div>
<div id="rules"><div class="wrap"><button class="rules-link close" id="rules-close"></button>
  <h3 id="rules-title"></h3><div id="rules-body"></div></div></div>
<script>
const T = {
  es: {
    title: 'Ajedrez <span class="q">cuántico</span> vs IA', sub: 'Elige la dificultad y tu color. Luego juega en la tablet.',
    level: 'Dificultad', color: 'Tu color', whiteFirst: 'Las blancas mueven primero.',
    hints: 'Pistas', hintsOpts: ['No', 'Sí'], hintsHint: 'La pantalla te sugiere una jugada en cada turno.',
    goTitle: '¡Ve a la tablet!', goYou: 'Haz tu primer movimiento: toca tu pieza, la casilla y Drop.',
    goAi: 'La IA mueve primero. Luego te toca a ti en la tablet.', goClose: 'Cerrar',
    noPhone: 'Ya no necesitas el teléfono. Puedes guardarlo o consultar las reglas aquí.', rulesBtn: 'Ver reglas',
    rulesTitle: 'Cómo jugar ajedrez cuántico', rulesClose: 'Cerrar',
    rules: [
      ['Objetivo', 'Captura al rey rival. <b style="display:inline">No existe el jaque</b>: el rey puede quedar atacado.'],
      ['Mover', 'Toca tu pieza, toca la casilla destino y pulsa <b style="display:inline">Drop</b>.'],
      ['Dividir · <span class="q">superposición</span>', 'Toca una pieza (no un peón), luego DOS casillas vacías y pulsa Drop. Queda en ambas a la vez, 50% / 50%. Puedes volver a dividir una mitad (25%).'],
      ['Unir', 'Toca las dos mitades de tu pieza, luego la casilla destino y pulsa Drop. Vuelve a ser 100% real.'],
      ['<span class="q">Medición</span>', 'Si una captura podría dejar dos piezas en la misma casilla, el juego mide. Si tu pieza no estaba ahí, la captura falla y pierdes el turno.'],
      ['<span class="q">Entrelazamiento</span>', 'Una pieza dividida puede bloquear un camino solo a veces. Entonces el destino de dos piezas queda ligado.'],
      ['El anillo', 'El anillo de color alrededor de cada pieza muestra su <span class="q">probabilidad</span>: completo = 100%, medio anillo = 50%.'],
      ['Peones', 'No se dividen ni se unen. Avanzan, capturan y coronan como siempre.'],
      ['Tus propias piezas', 'No puedes mover a una casilla donde podría estar una de tus piezas.'],
    ],
    pin: 'Código de la pantalla', start: 'Empezar partida', staff: 'Personal', stop: 'Detener partida',
    staffHint: 'Detiene a la IA. Para una nueva partida pulsa Restart en la tablet si hace falta.',
    levels: [['Principiante', '≈ 1400'], ['Intermedio', '≈ 1550'], ['Avanzado', '≈ 1850'], ['Experto', 'muy fuerte']],
    colors: ['Blancas', 'Negras', 'Al azar'],
    st: { idle: 'Listo para empezar.', sending: 'Enviando…', waiting: 'Esperando jugador.', starting: '¡Partida en marcha! Ve a la tablet.',
          playing: 'Partida en curso.', game_over: 'Partida terminada.', stopped: 'Partida detenida.',
          bad_pin: 'Código incorrecto. Revisa el número en la pantalla.', busy: 'Ya hay una partida en curso.',
          need_pin: 'Escribe el código de 4 cifras que aparece en la pantalla.', offline: 'Sin conexión con el juego.',
          restart: 'Pulsa Restart en la tablet para empezar.' }
  },
  en: {
    title: 'Quantum chess <span class="q">vs AI</span>', sub: 'Choose the difficulty and your color, then play on the tablet.',
    level: 'Difficulty', color: 'Your color', whiteFirst: 'White moves first.',
    hints: 'Hints', hintsOpts: ['No', 'Yes'], hintsHint: 'The screen suggests a move on each turn.',
    goTitle: 'Go to the tablet!', goYou: 'Make your first move: tap your piece, the square and Drop.',
    goAi: 'The AI moves first. Then it is your turn on the tablet.', goClose: 'Close',
    noPhone: 'You do not need your phone anymore. Put it away or check the rules here.', rulesBtn: 'View rules',
    rulesTitle: 'How to play quantum chess', rulesClose: 'Close',
    rules: [
      ['Goal', 'Capture the opposing king. <b style="display:inline">There is no check</b>: a king may stay attacked.'],
      ['Move', 'Tap your piece, tap the target square and press <b style="display:inline">Drop</b>.'],
      ['Split · <span class="q">superposition</span>', 'Tap a piece (not a pawn), then TWO empty squares and press Drop. It is on both at once, 50% / 50%. You can split a half again (25%).'],
      ['Merge', 'Tap both halves of your piece, then the target square and press Drop. It becomes 100% real again.'],
      ['<span class="q">Measurement</span>', 'If a capture could leave two pieces on one square, the game measures. If your piece was not there, the capture fails and you lose the turn.'],
      ['<span class="q">Entanglement</span>', 'A split piece may block a path only some of the time. Then the fate of two pieces is linked.'],
      ['The ring', 'The colored ring around each piece shows its <span class="q">probability</span>: full = 100%, half ring = 50%.'],
      ['Pawns', 'They cannot split or merge. They move, capture and promote as usual.'],
      ['Your own pieces', 'You cannot move to a square where one of your own pieces might be.'],
    ],
    pin: 'Code on the screen', start: 'Start game', staff: 'Staff', stop: 'Stop game',
    staffHint: 'Stops the AI. For a new game press Restart on the tablet if needed.',
    levels: [['Beginner', '≈ 1400'], ['Intermediate', '≈ 1550'], ['Advanced', '≈ 1850'], ['Expert', 'very strong']],
    colors: ['White', 'Black', 'Random'],
    st: { idle: 'Ready to start.', sending: 'Sending…', waiting: 'Waiting for a player.', starting: 'Game on! Go to the tablet.',
          playing: 'Game in progress.', game_over: 'Game over.', stopped: 'Game stopped.',
          bad_pin: 'Wrong code. Check the number on the screen.', busy: 'A game is already running.',
          need_pin: 'Type the 4-digit code shown on the screen.', offline: 'No connection to the game.',
          restart: 'Press Restart on the tablet to begin.' }
  }
};
const params = new URLSearchParams(location.search);
const topic = params.get('t');
const RELAY = params.get('relay') || 'https://ntfy.sh';
const local = !topic;                            // served by the kiosk itself: talk to /api directly
const sel = { level: 2, color: 'white', hints: false, lang: params.get('lang') === 'en' ? 'en' : 'es' };
let lastColor = 'white';
let lastState = 'idle', pending = null;
const $ = id => document.getElementById(id);

function render() {
  const L = T[sel.lang];
  document.documentElement.lang = sel.lang;
  $('t-title').innerHTML = L.title; $('t-sub').textContent = L.sub;
  $('t-level').textContent = L.level; $('t-color').textContent = L.color; $('t-white-first').textContent = L.whiteFirst;
  $('t-pin').textContent = L.pin; $('start').textContent = L.start; $('t-staff').textContent = L.staff;
  $('stop').textContent = L.stop; $('t-staff-hint').textContent = L.staffHint;
  document.querySelectorAll('.lang button').forEach(b => b.classList.toggle('on', b.dataset.lang === sel.lang));
  $('levels').innerHTML = L.levels.map((l, i) =>
    `<button class="opt ${sel.level === i + 1 ? 'on' : ''}" data-level="${i + 1}">${l[0]}<small>${l[1]}</small></button>`).join('');
  const keys = ['white', 'black', 'random'], cls = ['w', 'b', 'r'];
  $('colors').innerHTML = L.colors.map((c, i) =>
    `<button class="opt ${cls[i]} ${sel.color === keys[i] ? 'on' : ''}" data-color="${keys[i]}"><span class="dot"></span>${c}</button>`).join('');
  $('t-hints').textContent = L.hints; $('t-hints-hint').textContent = L.hintsHint;
  $('hints').innerHTML = L.hintsOpts.map((o, i) =>
    `<button class="opt ${sel.hints === (i === 1) ? 'on' : ''}" data-hints="${i}">${o}</button>`).join('');
  $('go-title').textContent = L.goTitle; $('go-close').textContent = L.goClose;
  $('go-nophone').textContent = L.noPhone; $('go-rules').textContent = L.rulesBtn;
  $('open-rules').textContent = L.rulesBtn; $('rules-close').textContent = L.rulesClose;
  $('rules-title').textContent = L.rulesTitle;
  $('rules-body').innerHTML = L.rules.map(r => `<div class="card"><b>${r[0]}</b><span>${r[1]}</span></div>`).join('');
  $('pin-box').classList.toggle('hidden', local);
  $('staff').classList.toggle('on', local || params.get('staff') === '1');
  showState(lastState);
}
function goToTablet(color) {
  const L = T[sel.lang];
  $('go-text').textContent = color === 'black' ? L.goAi : L.goYou;
  $('go').classList.add('on');
}
$('go-close').onclick = () => $('go').classList.remove('on');
$('go-rules').onclick = () => { $('go').classList.remove('on'); $('rules').classList.add('on'); };
$('open-rules').onclick = () => $('rules').classList.add('on');
$('rules-close').onclick = () => $('rules').classList.remove('on');
function showState(key, cls) {
  if (key === 'starting' && lastState !== 'starting') goToTablet(lastColor);
  lastState = key;
  const el = $('status'); el.textContent = T[sel.lang].st[key] || key;
  el.className = cls || (['starting', 'playing'].includes(key) ? 'ok' : ['bad_pin', 'busy', 'offline'].includes(key) ? 'bad' : '');
}

document.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.lang) { sel.lang = b.dataset.lang; render(); }
  if (b.dataset.level) { sel.level = +b.dataset.level; render(); }
  if (b.dataset.color) { sel.color = b.dataset.color; render(); }
  if (b.dataset.hints !== undefined) { sel.hints = b.dataset.hints === '1'; render(); }
});

async function send(action) {
  const msg = { v: 1, action, level: sel.level, color: sel.color, lang: sel.lang, hints: sel.hints,
                pin: $('pin').value.trim(), nonce: Math.random().toString(36).slice(2, 10) };
  if (!local && action === 'start' && !/^\d{4}$/.test(msg.pin)) { showState('need_pin', 'bad'); return; }
  showState('sending');
  lastColor = sel.color === 'random' ? 'white' : sel.color;
  try {
    if (local) {
      const r = await fetch('/api/' + action, { method: 'POST', body: JSON.stringify(msg) });
      const d = await r.json(); if (d.player_color) lastColor = d.player_color; showState(d.error || d.state);
    } else {
      pending = msg.nonce;
      await fetch(`${RELAY}/${topic}`, { method: 'POST', body: JSON.stringify(msg) });
      setTimeout(() => { if (pending === msg.nonce) showState('offline'); }, 8000);
    }
  } catch (err) { showState('offline'); }
}
$('start').onclick = () => send('start');
$('stop').onclick = () => send('stop');

// live state from the kiosk
if (local) {
  setInterval(async () => {
    try { const d = await (await fetch('/api/state')).json(); if (!pending) showState(d.state); } catch (e) { showState('offline'); }
  }, 1500);
} else {
  const es = new EventSource(`${RELAY}/${topic}-s/sse`);
  es.onmessage = e => {
    try {
      const outer = JSON.parse(e.data); const d = JSON.parse(outer.message || '{}');
      if (d.nonce && d.nonce === pending) { pending = null; if (d.player_color) lastColor = d.player_color; }
      if (!pending) showState(d.error || d.state);
    } catch (err) { }
  };
}
render();
</script>
</body>
</html>
